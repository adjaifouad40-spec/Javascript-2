<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Project 2 — Fonctions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.6rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e5e5; font-size: .95rem; }
    th { background: #f5f5f5; }
    code { background: #f3f3f3; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>JavaScript Project 2 — résultats des fonctions</h1>
  <p>Ouvrez la console du navigateur (F12) pour tester vous-même, par exemple <code>isPrime(97)</code>.</p>
  <table>
    <thead><tr><th>Appel</th><th>Résultat</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <script src="functions.js"></script>
  <script>
    const examples = [
      ["reverseString('bonjour')", () => reverseString("bonjour")],
      ["countCharacters('Hello World')", () => countCharacters("Hello World")],
      ["capitalizeWords('le développement web')", () => capitalizeWords("le développement web")],
      ["findMax([3, 17, -4, 9])", () => findMax([3, 17, -4, 9])],
      ["findMin([3, 17, -4, 9])", () => findMin([3, 17, -4, 9])],
      ["sumArray([1, 2, 3, 4, 5])", () => sumArray([1, 2, 3, 4, 5])],
      ["filterArray([1,2,3,4,5,6], n => n % 2 === 0)", () => filterArray([1, 2, 3, 4, 5, 6], n => n % 2 === 0)],
      ["factorial(5)", () => factorial(5)],
      ["isPrime(7)", () => isPrime(7)],
      ["isPrime(12)", () => isPrime(12)],
      ["fibonacci(10)", () => fibonacci(10)],
    ];
    const tbody = document.getElementById("results");
    for (const [label, fn] of examples) {
      const row = document.createElement("tr");
      row.innerHTML = `<td><code>${label}</code></td><td>${JSON.stringify(fn())}</td>`;
      tbody.appendChild(row);
    }
  </script>
</body>
</html>
